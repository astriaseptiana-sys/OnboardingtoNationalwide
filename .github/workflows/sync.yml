name: Sync Success ke Nationwide

on:
  schedule:
    # Cron GitHub memakai UTC. WIB = UTC+7.
    - cron: "0 2 * * *"   # 09:00 WIB
    - cron: "0 5 * * *"   # 12:00 WIB
    - cron: "0 20 * * *"  # 03:00 WIB (dini hari)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: baca sumber dan tampilkan laporan, tanpa menulis ke Nationwide"
        type: boolean
        default: false
      trial:
        description: "TRIAL: hanya isi tab Sort by New (Trial); Nationwide, Sort by New, Control Panel, LOG, SeaTalk tidak disentuh"
        type: boolean
        default: false
      trial_full:
        description: "TRIAL + tulis ulang PENUH (biasanya impor hanya baris baru). Dipakai untuk menyamakan tab dengan sumber"
        type: boolean
        default: false

concurrency:
  group: sync-nationwide
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # penulisan ±8-11 menit; sync diulang sekali kalau gagal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Jalankan sync
        run: node src/sync.js
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TRIAL: ${{ inputs.trial }}
          TRIAL_FULL: ${{ inputs.trial_full }}
          # Opsional (Settings -> Secrets and variables -> Actions -> Variables): tab trial ditulis ke FILE Google Sheets lain
          # (batas 10 juta sel dihitung per file) dan tanggal awal cakupan (YYYY-MM-DD, bawaan 2026-07-01).
          TRIAL_SPREADSHEET_ID: ${{ vars.TRIAL_SPREADSHEET_ID || secrets.TRIAL_SPREADSHEET_ID }}
          TRIAL_START: ${{ vars.TRIAL_START }}
          # Isi file key service account (JSON). Nama secret di repo ini: ONBOARDING_TO_NATIONALWIDE.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.ONBOARDING_TO_NATIONALWIDE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SEATALK_WEBHOOK_URL: ${{ secrets.SEATALK_WEBHOOK_URL }}
